name: Refresh baked data + redeploy

# Keeps the React app's baked JSON as current as the Streamlit app. Runs after the
# source repo's scheduled cache refresh (fundamentals ~10am & ~11pm ET). Re-bakes
# against the SOURCE repo's fresh caches and commits the refreshed public/data here;
# the push auto-deploys on Vercel (git integration).
on:
  schedule:
    - cron: "30 15 * * *"   # ~11:30 ET (after morning fundamentals refresh)
    - cron: "30 4 * * *"    # ~00:30 ET (after evening fundamentals refresh)
  workflow_dispatch: {}      # manual trigger from the Actions tab

permissions:
  contents: write            # GITHUB_TOKEN may push back to this repo
  issues: write              # open/append a tracking issue if the job fails

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  rebake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2 (this repo - has bake/ tooling)
        uses: actions/checkout@v4
        with:
          # ROOT-CAUSE FIX: full history. checkout@v4 defaults to a shallow
          # (fetch-depth: 1) clone. The bot then commits a large public/data bake
          # (~5.9k JSON files) on top of a grafted single-commit history, and
          # `git push` fails with "ref 'main': missing object: <sha>" because the
          # thin-pack negotiation references tree/blob objects below the shallow
          # horizon that the job never fetched. fetch-depth: 0 guarantees the push
          # references only objects the job actually has.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Clone source repo + pull price-cache LFS object
        run: |
          git lfs install
          git clone --depth 1 https://github.com/bradleygpt/quant-dashboard-pro.git source
          # FAIL LOUD on LFS pull failure (was `|| true`). A swallowed failure here
          # bakes a 130-byte LFS pointer instead of the real parquet -> silent bad
          # data / crash (gap #6). If the pull fails, the whole run should go red.
          cd source && git lfs pull --include="prices_cache.parquet"

      - name: Install deps
        run: pip install -r source/requirements.txt pyarrow

      - name: Re-bake against fresh caches
        run: |
          # Canonical bake = source/bake/bake.py (cloned from the source repo); it
          # os.chdir(ROOT)+sys.path.insert(ROOT) to resolve its deps from source/.
          cd source && python bake/bake.py        # writes source/web/public/data

      - name: Sync refreshed data into this repo (non-destructive)
        run: |
          mkdir -p public/data
          cp -r source/web/public/data/. public/data/
          # NOTE: no rm -rf. c78q.json, ai_deals.json, and MLPred files are baked
          # locally from quant-historical (unavailable in CI) and must NOT be deleted.
          # This overlays CI-baked files only, preserving locally-committed data.
          # OPTION B: preserve the committed jsDelivr `blob` pointer. The freshly-baked
          # freshness_manifest.json has NO blob section (bulk data now lives in the
          # akribeia-data repo, served via jsDelivr, and the git path is slimmed away).
          # Without this, the twice-daily rebake would overwrite the blob pointer, the
          # resolver would fall back to the now-404 git path, and prod would lose all
          # bulk data. CI never changes bulk, so the committed blob is always the valid
          # current pointer — carry it forward verbatim.
          python - <<'PY'
          import json, subprocess
          p = 'public/data/freshness_manifest.json'
          new = json.load(open(p))
          try:
              old = json.loads(subprocess.check_output(
                  ['git','show','HEAD:public/data/freshness_manifest.json'], text=True))
          except subprocess.CalledProcessError:
              old = {}
          if old.get('blob'):
              new['blob'] = old['blob']
              json.dump(new, open(p,'w'), indent=2)
              print('preserved blob pointer:', old['blob'].get('commit_sha','')[:12])
          else:
              print('no committed blob section to preserve (pre-migration state)')
          PY

      - name: Commit + push (auto-deploys on Vercel)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data change - skipping commit."
            exit 0
          fi
          git commit -m "chore: bake data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          # Resilient push (fixes #2). The bake runs ~9 min and main has many writers
          # (manual strategy JSON / system_status / c78q / dev commits), so a bare
          # `git push` was rejected non-fast-forward on ~1/3 of runs and failed the
          # whole refresh. Rebase onto the latest tip and retry — but CONFLICT-AWARE,
          # not a blind rebase: if a concurrent commit touched the SAME file the
          # rebase fails, we abort and exit loud (the original concern — never replay
          # the bake over a concurrent manual edit). When the concurrent push touched
          # DIFFERENT files (the common case: baked data vs code), the rebase is clean
          # and the retry pushes successfully.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); fetch + rebase onto origin/main"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::rebase conflict on public/data — a concurrent commit edited the same file. Not replaying the bake over it; the next run re-bakes from the new tip."
              exit 1
            fi
          done
          echo "::error::push still failing after 5 rebase-retries"
          exit 1

      - name: Surface failure (anti-silent-break)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A scheduled job that fails silently for days is the lapsed-SEC-fetch
          # class. Open one tracking issue and append to it on repeat failures
          # (deduped so repeated failures don't spam new issues).
          title="Rebake refresh workflow is failing"
          body="Scheduled rebake failed on $(date -u +%Y-%m-%dT%H:%MZ). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "$body"
          else
            gh issue comment "$existing" --body "$body"
          fi
